[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artalk-streamlit-realtime"
version = "0.1.0"
description = "Standalone Streamlit realtime demo for packaged ARTalk and GAGAvatar"
requires-python = ">=3.12"
dependencies = [
  "artalk",
  "av",
  "gagavatar",
  "numpy",
  "openai",
  "streamlit>=1.58.0,<2",
  "streamlit-webrtc>=0.74.0",
]

[project.scripts]
artalk-demo = "artalk_streamlit_realtime.launcher:main"

[project.optional-dependencies]
personaplex = [
  "aiohttp>=3.10",
  "sphn<0.2",
]
fallingwater = [
  "wandb",
]

[dependency-groups]
dev = [
  "streamlit-remote>=0.7.1",
]

[tool.setuptools]
py-modules = ["streamlit_app"]
packages = ["artalk_streamlit_realtime"]

[tool.artalk.assets]
root = "assets"
