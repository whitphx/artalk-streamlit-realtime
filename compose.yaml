services:
  app:
    build: .
    command: ["pixi", "run", "artalk-demo", "up", "--profile", "server"]
    ports:
      - "8501:8501"
    volumes:
      - ./assets:/app/assets
      - hf-cache:/app/.cache/huggingface
      - ./user_avatars:/app/user_avatars
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
